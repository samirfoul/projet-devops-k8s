server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Pas de cache sur index.html pour forcer le rechargement de la nouvelle version
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Cache long terme pour les assets hashés (JS, CSS, images)
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
